name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test & build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Vite 8 requires Node 20.19+ / 22.12+
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Non-blocking until the existing lint errors are fixed in the Phase 1 refactor
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Test
        run: npm test

      # Placeholder values: Vite inlines VITE_* at build time; the build never contacts Supabase/ORS
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
          VITE_ORS_API_KEY: placeholder-ors-key
