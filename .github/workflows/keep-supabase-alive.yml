name: Keep Supabase Active

# Backup for the daily Vercel cron (api/cron/daily). Supabase pauses free
# projects after about 7 days without database activity, so this calls
# keepalive() (migration 0010), a real database write. The old ping
# (GET /rest/v1/) could be answered from cache without touching the database.
# Note: GitHub disables scheduled workflows after 60 days without repository
# activity; the Vercel cron has no such limit.

on:
  schedule:
    - cron: '17 6 */2 * *' # every other day, 06:17 UTC (off the hour: less queueing)
  workflow_dispatch: {}

jobs:
  ping-supabase:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    timeout-minutes: 5
    steps:
      - name: Call keepalive()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Tolerate whitespace, newlines and a trailing slash pasted into the secrets
          url=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]' | sed 's#/*$##')
          key=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')

          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          if ! printf '%s' "$url" | grep -Eq '^https://[a-z0-9]+\.supabase\.co$'; then
            echo "::error::SUPABASE_URL should look like https://<project-ref>.supabase.co (Supabase > Project Settings > API)."
            exit 1
          fi

          if ! response=$(curl -sS --fail-with-body --retry 3 --retry-all-errors --max-time 20 \
              -X POST "$url/rest/v1/rpc/keepalive" \
              -H "apikey: $key" \
              -H "Authorization: Bearer $key" \
              -H "Content-Type: application/json" \
              -d '{"p_source":"github-actions"}'); then
            echo "::error::keepalive() call failed: $response"
            exit 1
          fi

          echo "Database pinged at $response"
